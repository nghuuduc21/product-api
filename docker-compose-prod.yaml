name: product-api

services:
  mongodb:
    image: mongo:8.0
    container_name: nammongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "quit(db.adminCommand({ ping: 1 }).ok === 1 ? 0 : 1)"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

  api:
    image: ${PRODUCT_API_IMAGE:?Can khai bao PRODUCT_API_IMAGE trong .env.prod}
    container_name: product-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${PORT:?Can khai bao PORT}
      MONGODB_URI: ${MONGODB_URI:?Can khai bao MONGODB_URI}
    ports:
      - "127.0.0.1:3000:${PORT}"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "src/healthcheck.js"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  mongodb_data:
    external: true
    name: nammongodb_data