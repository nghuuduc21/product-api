services:
  mongodb:
    image: mongo:8.0
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "quit(db.adminCommand({ ping: 1 }).ok === 1 ? 0 : 1)"
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: product-api:ci
    environment:
      NODE_ENV: test
      PORT: "3000"
      MONGODB_URI: mongodb://mongodb:27017/productdb_ci
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "src/healthcheck.js"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 12